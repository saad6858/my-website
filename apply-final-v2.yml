name: Apply FINAL v2 (intro circle fix + classic design)
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          set -euo pipefail
          test -f FINAL-SITE-FIX-v2.zip
          unzip -o FINAL-SITE-FIX-v2.zip -d /tmp/pack
          mkdir -p components app/admin lib
          cp -f /tmp/pack/components/intro-gate.tsx components/intro-gate.tsx
          cp -f /tmp/pack/app/globals.css app/globals.css
          cp -f /tmp/pack/app/admin/page.tsx app/admin/page.tsx
          cp -f /tmp/pack/lib/public-data.ts lib/public-data.ts
      - name: Verify
        run: |
          set -euo pipefail
          grep -q 'intro-gate-square' components/intro-gate.tsx
          grep -q 'width: 100% !important' app/globals.css
          ! grep -E 'intro-gate\{[^}]*border-radius:50%' app/globals.css
          grep -q 'admin-login-card' app/admin/page.tsx
          grep -q 'CLASSIC DESIGN REVERT' app/globals.css
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "sm-fix-bot"
          git config user.email "bot@smautomations.tech"
          git add components/intro-gate.tsx app/globals.css app/admin/page.tsx lib/public-data.ts
          git commit -m "FINAL v2: fix circular intro CSS corruption, full-screen square intro, classic dark design" || true
          git push || true
      - name: Cleanup
        run: |
          git rm -f FINAL-SITE-FIX-v2.zip .github/workflows/apply-final-v2.yml 2>/dev/null || true
          git rm -f .github/workflows/apply-*.yml 2>/dev/null || true
          git commit -m "chore: remove apply workflows after FINAL v2" || true
          git push || true
