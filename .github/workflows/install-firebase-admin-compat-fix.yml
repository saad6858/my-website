name: Install Firebase Admin compatibility fix

on:
  push:
    paths:
      - "firebase-admin-compat-fix.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-firebase-admin-compat-fix
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "firebase-admin-compat-fix.zip"
          unzip -q -t "firebase-admin-compat-fix.zip"

      - name: Extract repo-root overlay
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          unzip -q "firebase-admin-compat-fix.zip" -d "$TMP_DIR"

          ROOT="$TMP_DIR"
          TOP_DIRS=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT="$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          test -f "$ROOT/package.json"
          test -f "$ROOT/COMPATIBILITY_FIX.md"
          rsync -a "$ROOT/" ./

      - name: Assert Firebase Admin version
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.dependencies["firebase-admin"]!=="13.10.0") process.exit(1)'

      - name: Remove one-shot installer and uploaded archive
        shell: bash
        run: |
          rm -f "firebase-admin-compat-fix.zip"
          rm -f ".github/workflows/install-firebase-admin-compat-fix.yml"

      - name: Commit installed compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Firebase Admin serverless compatibility"
          git push
