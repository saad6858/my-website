name: Allow CMS page slugs (about/contact/…)
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          set -euo pipefail
          test -f RESERVED-SLUG-FIX.zip
          unzip -o RESERVED-SLUG-FIX.zip -d /tmp/pack
          mkdir -p "app/api/admin/[collection]"
          cp -f "/tmp/pack/app/api/admin/[collection]/route.ts" "app/api/admin/[collection]/route.ts"
      - name: Verify
        run: |
          set -euo pipefail
          grep -q "\['admin','api'\]" "app/api/admin/[collection]/route.ts"
          ! grep -q "\['about','services'" "app/api/admin/[collection]/route.ts" || true
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "sm-fix-bot"
          git config user.email "bot@smautomations.tech"
          git add "app/api/admin/[collection]/route.ts"
          git commit -m "fix: only reserve admin/api page slugs so CMS can own about/contact/services" || true
          git push || true
      - name: Cleanup
        run: |
          git rm -f RESERVED-SLUG-FIX.zip .github/workflows/apply-reserved-slug-fix.yml 2>/dev/null || true
          git commit -m "chore: remove reserved-slug workflow" || true
          git push || true
