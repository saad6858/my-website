
name: Repair Website Type Errors and Verify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-website
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair site settings and section types
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExactly(file, before, after, description) {
            const source = fs.readFileSync(file, 'utf8');
            const count = source.split(before).length - 1;

            if (count === 0) {
              if (source.includes(after)) {
                console.log(`Already applied: ${description}`);
                return;
              }
              throw new Error(`Could not find expected source for: ${description} in ${file}`);
            }

            if (count !== 1) {
              throw new Error(`Expected exactly one match for ${description}; found ${count}`);
            }

            fs.writeFileSync(file, source.replace(before, after));
            console.log(`Applied: ${description}`);
          }

          replaceExactly(
            'lib/content.ts',
            "items?:Array<{title:string;body:string;href?:string;label?:string}>",
            "items?:Array<{title:string;body?:string;href?:string;label?:string}>",
            'Allow optional section item body text'
          );

          replaceExactly(
            'lib/content.ts',
            "siteUrl:'https://smautomations.tech',footerText:",
            "siteUrl:'https://smautomations.tech',seoTitle:'SM Automations — Intelligent Systems',seoDescription:'Custom AI assistants, intelligent workflow automation and agentic systems that help businesses work smarter.',socialImage:'',footerText:",
            'Add metadata fields to initial site settings'
          );
          NODE

      - name: Install dependencies without npm cache
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run TypeScript check
        id: typecheck
        shell: bash
        run: |
          mkdir -p repair-logs
          set +e
          npm run typecheck > repair-logs/typescript.log 2>&1
          result=$?
          cat repair-logs/typescript.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run ESLint report
        if: always()
        shell: bash
        run: |
          set +e
          npm run lint > repair-logs/eslint.log 2>&1
          cat repair-logs/eslint.log
          exit 0

      - name: Run production build
        id: build
        if: steps.typecheck.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run build > repair-logs/build.log 2>&1
          result=$?
          cat repair-logs/build.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "TypeScript exit: ${{ steps.typecheck.outputs.exit_code }}"
            echo "Production build exit: ${{ steps.build.outputs.exit_code }}"
            echo "ESLint is recorded separately and is not a build gate."
          } > repair-logs/summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-repair-diagnostics
          path: repair-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Require TypeScript and production build to pass
        if: steps.typecheck.outputs.exit_code != '0' || steps.build.outputs.exit_code != '0'
        run: |
          echo "Verification failed. Download website-repair-diagnostics for exact errors."
          exit 1

      - name: Remove temporary workflow after successful verification
        if: steps.typecheck.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-website.yml
          git commit -m "Remove temporary repair workflow after successful verification"
          git push origin HEAD:main
