
name: Repair Website Source and Verify Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-website
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair raw newlines inside quoted strings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const file = 'lib/content.ts';
          const source = fs.readFileSync(file, 'utf8');
          let output = '';
          let state = 'normal';
          let changes = 0;

          for (let i = 0; i < source.length; i++) {
            const ch = source[i];
            const next = source[i + 1];

            if (state === 'line-comment') {
              output += ch;
              if (ch === '\n') state = 'normal';
              continue;
            }

            if (state === 'block-comment') {
              output += ch;
              if (ch === '*' && next === '/') {
                output += next;
                i++;
                state = 'normal';
              }
              continue;
            }

            if (state === 'template') {
              output += ch;
              if (ch === '\\' && i + 1 < source.length) {
                output += source[++i];
              } else if (ch === '`') {
                state = 'normal';
              }
              continue;
            }

            if (state === 'single' || state === 'double') {
              if (ch === '\\' && i + 1 < source.length) {
                output += ch + source[++i];
                continue;
              }

              if (
                (state === 'single' && ch === "'") ||
                (state === 'double' && ch === '"')
              ) {
                output += ch;
                state = 'normal';
                continue;
              }

              if (ch === '\n' || ch === '\r') {
                output += '\\n';
                if (ch === '\r' && next === '\n') i++;
                while (source[i + 1] === ' ' || source[i + 1] === '\t') i++;
                changes++;
                continue;
              }

              output += ch;
              continue;
            }

            if (ch === '/' && next === '/') {
              output += '//';
              i++;
              state = 'line-comment';
            } else if (ch === '/' && next === '*') {
              output += '/*';
              i++;
              state = 'block-comment';
            } else if (ch === "'") {
              output += ch;
              state = 'single';
            } else if (ch === '"') {
              output += ch;
              state = 'double';
            } else if (ch === '`') {
              output += ch;
              state = 'template';
            } else {
              output += ch;
            }
          }

          if (changes > 0) {
            fs.writeFileSync(file, output);
          }

          console.log(`Repaired raw newlines: ${changes}`);

          if (state === 'single' || state === 'double') {
            console.error('An unterminated quoted string remains.');
            process.exit(1);
          }
          NODE

      - name: Install dependencies without cache
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run TypeScript check
        id: typecheck
        shell: bash
        run: |
          mkdir -p repair-logs
          set +e
          npm run typecheck > repair-logs/typescript.log 2>&1
          result=$?
          cat repair-logs/typescript.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run ESLint and save full report
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > repair-logs/eslint.log 2>&1
          result=$?
          cat repair-logs/eslint.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > repair-logs/build.log 2>&1
          result=$?
          cat repair-logs/build.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "TypeScript exit: ${{ steps.typecheck.outputs.exit_code }}"
            echo "ESLint exit: ${{ steps.lint.outputs.exit_code }}"
            echo "Build exit: ${{ steps.build.outputs.exit_code }}"
          } > repair-logs/summary.txt

      - name: Upload all verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-repair-diagnostics
          path: repair-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Require TypeScript and production build to pass
        if: steps.typecheck.outputs.exit_code != '0' || steps.build.outputs.exit_code != '0'
        run: |
          echo "TypeScript or production build still fails. Download the diagnostics artifact."
          exit 1

      - name: Remove temporary repair workflow after successful build
        if: steps.typecheck.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-website.yml
          git commit -m "Remove temporary repair workflow after build verification"
          git push origin HEAD:main
