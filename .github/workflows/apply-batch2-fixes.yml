name: Apply Batch 2 fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require ZIP
        run: |
          if [ ! -f batch2-fixes.zip ]; then
            echo "batch2-fixes.zip not found at repository root. Upload it first, then re-run."
            exit 1
          fi

      - name: Extract and apply files
        run: |
          set -e
          mkdir -p /tmp/batch2-extract
          unzip -o batch2-fixes.zip -d /tmp/batch2-extract

          mkdir -p app/projects
          mkdir -p app/admin
          mkdir -p components

          cp -f /tmp/batch2-extract/app/projects/page.tsx app/projects/page.tsx
          cp -f /tmp/batch2-extract/app/admin/page.tsx app/admin/page.tsx
          cp -f /tmp/batch2-extract/components/section-renderer.tsx components/section-renderer.tsx

          echo "Applied:"
          ls -la app/projects/page.tsx app/admin/page.tsx components/section-renderer.tsx

      - name: Remove uploaded ZIP
        run: rm -f batch2-fixes.zip

      - name: Commit and push
        run: |
          git config user.name "batch2-fix-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Batch 2: per-project and per-card size control (cardHeight, thumbHeight, thumbHeightMobile) with site defaults as fallback"
            git push
          fi
