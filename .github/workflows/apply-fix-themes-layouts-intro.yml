name: Apply themes layouts intro fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ZIP
        run: |
          if [ ! -f fix-themes-layouts-intro.zip ]; then echo "Missing zip"; exit 1; fi
      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/fx
          unzip -o fix-themes-layouts-intro.zip -d /tmp/fx
          mkdir -p app/admin app/api/admin/settings components lib
          cp -f /tmp/fx/app/globals.css app/globals.css
          cp -f /tmp/fx/app/layout.tsx app/layout.tsx
          cp -f /tmp/fx/app/page.tsx app/page.tsx
          cp -f /tmp/fx/app/admin/page.tsx app/admin/page.tsx
          cp -f /tmp/fx/app/api/admin/settings/route.ts app/api/admin/settings/route.ts
          cp -f /tmp/fx/components/intro-gate.tsx components/intro-gate.tsx
          cp -f /tmp/fx/components/site-header.tsx components/site-header.tsx
          cp -f /tmp/fx/lib/public-data.ts lib/public-data.ts
          grep -q 'data-theme="glass"' app/globals.css
          grep -q 'data-theme="tokyo"' app/globals.css
          grep -q 'data-theme="evolute"' app/globals.css
          grep -q 'data-theme="cinematic"' app/globals.css
          grep -q 'data-theme="editorial"' app/globals.css
          grep -q 'intro-stop' components/intro-gate.tsx
          grep -q 'is-rail' components/site-header.tsx
          grep -q 'IntroGate' app/layout.tsx
          ! grep -q 'intro-scene-dots' components/intro-gate.tsx
      - name: Remove ZIP
        run: rm -f fix-themes-layouts-intro.zip
      - name: Commit and push
        run: |
          git config user.name "fix-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "5 reference themes, structural rail/bento layouts, intro stop+no-dots sitewide"
            git push
          fi
