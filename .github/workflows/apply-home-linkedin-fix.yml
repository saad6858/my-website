name: Apply home routing + remove LinkedIn everywhere
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          set -euo pipefail
          test -f HOME-LINKEDIN-FIX.zip
          unzip -o HOME-LINKEDIN-FIX.zip -d /tmp/pack
          mkdir -p lib components app/contact "app/api/admin/[collection]" "app/[...slug]" app
          cp -f /tmp/pack/lib/public-data.ts lib/public-data.ts
          cp -f /tmp/pack/lib/content.ts lib/content.ts
          cp -f /tmp/pack/components/site-footer.tsx components/site-footer.tsx
          cp -f /tmp/pack/components/contact-form.tsx components/contact-form.tsx
          cp -f /tmp/pack/app/contact/page.tsx app/contact/page.tsx
          cp -f /tmp/pack/app/api/admin/\[collection\]/route.ts app/api/admin/\[collection\]/route.ts
          cp -f /tmp/pack/app/\[...slug\]/page.tsx app/\[...slug\]/page.tsx
          cp -f /tmp/pack/app/layout.tsx app/layout.tsx
      - name: Verify
        run: |
          set -euo pipefail
          grep -q 'candidates' lib/public-data.ts
          grep -q 'isHomePageSlug' app/api/admin/\[collection\]/route.ts
          grep -q "path==='home'" app/\[...slug\]/page.tsx
          ! grep -q 'LinkedIn' components/site-footer.tsx
          ! grep -q 'LinkedIn' app/contact/page.tsx
          ! grep -q 'LinkedIn' components/contact-form.tsx
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "sm-fix-bot"
          git config user.email "bot@smautomations.tech"
          git add lib/public-data.ts lib/content.ts \
            components/site-footer.tsx components/contact-form.tsx \
            app/contact/page.tsx app/layout.tsx \
            "app/api/admin/[collection]/route.ts" "app/[...slug]/page.tsx"
          git commit -m "fix: homepage / resolves empty or home slug; remove LinkedIn from footer, contact, form" || true
          git push || true
      - name: Cleanup
        run: |
          git rm -f HOME-LINKEDIN-FIX.zip .github/workflows/apply-home-linkedin-fix.yml 2>/dev/null || true
          git commit -m "chore: remove home-linkedin apply workflow" || true
          git push || true
