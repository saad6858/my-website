name: Apply Batch 5 fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require ZIP
        run: |
          if [ ! -f batch5-fixes.zip ]; then
            echo "batch5-fixes.zip not found at repository root."
            exit 1
          fi

      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/b5x
          unzip -o batch5-fixes.zip -d /tmp/b5x
          mkdir -p components app/api/admin/settings app/admin
          cp -f /tmp/b5x/components/motion-system.tsx components/motion-system.tsx
          cp -f /tmp/b5x/components/intro-gate.tsx components/intro-gate.tsx
          cp -f /tmp/b5x/components/section-renderer.tsx components/section-renderer.tsx
          cp -f /tmp/b5x/app/globals.css app/globals.css
          cp -f /tmp/b5x/app/layout.tsx app/layout.tsx
          cp -f /tmp/b5x/app/page.tsx app/page.tsx
          cp -f /tmp/b5x/app/admin/page.tsx app/admin/page.tsx
          cp -f /tmp/b5x/app/api/admin/settings/route.ts app/api/admin/settings/route.ts
          ls -la components/motion-system.tsx app/globals.css app/admin/page.tsx

      - name: Remove ZIP
        run: rm -f batch5-fixes.zip

      - name: Commit and push
        run: |
          git config user.name "batch5-fix-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Batch 5 final: CTA rings removed, zoom lag (blur/will-change), site feature toggles, intro 3-way mode"
            git push
          fi
