name: Apply Fix1 (CTA size, theme save, admin forms)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require ZIP
        run: |
          if [ ! -f fix1-cta-theme-admin.zip ]; then
            echo "fix1-cta-theme-admin.zip not found at repository root."
            exit 1
          fi

      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/fx1
          unzip -o fix1-cta-theme-admin.zip -d /tmp/fx1
          mkdir -p app/admin components
          cp -f /tmp/fx1/app/globals.css app/globals.css
          cp -f /tmp/fx1/app/admin/page.tsx app/admin/page.tsx
          ls -la app/globals.css app/admin/page.tsx
          # sanity
          grep -q "slate','ink','forest" app/admin/page.tsx
          grep -q "FIX1: CTA size" app/globals.css
          grep -q "admin-form-lead" app/admin/page.tsx

      - name: Remove ZIP
        run: rm -f fix1-cta-theme-admin.zip

      - name: Commit and push
        run: |
          git config user.name "fix1-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix1: CTA panel size, theme load wipe, lead/page structured forms"
            git push
          fi
