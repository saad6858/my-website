name: Apply True Layouts + Design V2 (merged)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ZIP
        run: |
          if [ ! -f fix-layouts-true.zip ]; then echo "Missing fix-layouts-true.zip"; exit 1; fi
      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/fx
          unzip -o fix-layouts-true.zip -d /tmp/fx
          mkdir -p app/admin app/api/admin/settings components lib
          cp -f /tmp/fx/app/globals.css app/globals.css
          cp -f /tmp/fx/app/layout.tsx app/layout.tsx
          cp -f /tmp/fx/app/page.tsx app/page.tsx
          cp -f /tmp/fx/app/admin/page.tsx app/admin/page.tsx
          cp -f /tmp/fx/app/api/admin/settings/route.ts app/api/admin/settings/route.ts
          cp -f /tmp/fx/components/intro-gate.tsx components/intro-gate.tsx
          cp -f /tmp/fx/lib/public-data.ts lib/public-data.ts
          grep -q 'data-layout="rail"' app/globals.css
          grep -q 'data-layout="bento"' app/globals.css
          grep -q 'INTRO_PRESETS' components/intro-gate.tsx
          grep -q 'void' app/globals.css
      - name: Remove ZIP
        run: rm -f fix-layouts-true.zip
      - name: Commit and push
        run: |
          git config user.name "layouts-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "True layouts rail+bento (full UX) merged with Design V2 themes and narrative intro"
            git push
          fi
