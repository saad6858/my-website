name: Apply Fix2 (themes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ZIP
        run: |
          if [ ! -f fix2-themes.zip ]; then echo "Missing fix2-themes.zip"; exit 1; fi
      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/fx
          unzip -o fix2-themes.zip -d /tmp/fx
          mkdir -p "$(dirname app/globals.css)"
          cp -f /tmp/fx/app/globals.css app/globals.css
          mkdir -p "$(dirname app/layout.tsx)"
          cp -f /tmp/fx/app/layout.tsx app/layout.tsx
          mkdir -p "$(dirname app/admin/page.tsx)"
          cp -f /tmp/fx/app/admin/page.tsx app/admin/page.tsx
          ls -la app/globals.css app/layout.tsx app/admin/page.tsx
      - name: Remove ZIP
        run: rm -f fix2-themes.zip
      - name: Commit and push
        run: |
          git config user.name "fix2-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Fix2: themes visibly distinct — accent owned by theme, not forced red"
            git push
          fi
