name: Install complete website

on:
  workflow_dispatch:
    inputs:
      confirm_replace:
        description: 'Type REPLACE to confirm that all current repository code will be replaced.'
        required: true
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: install-complete-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch selected for this manual run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Require explicit replacement confirmation
        env:
          CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM_REPLACE" != "REPLACE" ]; then
            echo '::error::No repository changes were made. Run the workflow again and enter REPLACE.'
            exit 1
          fi

      - name: Validate uploaded website ZIP (no build/install is run here)
        shell: bash
        run: |
          set -euo pipefail
          ZIP='saad-maqbool-complete-website.zip'
          test -f "$ZIP" || { echo '::error::Upload saad-maqbool-complete-website.zip to the repository root first.'; exit 1; }
          python3 - <<'PY'
          import os, re, stat, sys, zipfile
          path = 'saad-maqbool-complete-website.zip'
          required = {
              'package.json', 'tsconfig.json', 'next.config.ts',
              'app/layout.tsx', 'app/page.tsx', 'app/admin/page.tsx',
              'app/api/contact/route.ts', 'app/api/admin/seed/route.ts',
              'components/section-renderer.tsx', 'components/motion-system.tsx',
              'lib/firebase-admin.ts', 'lib/upload-limits.ts',
              'firestore.rules', '.env.example', 'README.md'
          }
          errors = []
          try:
              with zipfile.ZipFile(path) as z:
                  damaged = z.testzip()
                  if damaged:
                      errors.append('Corrupt ZIP entry: ' + damaged)
                  names = set()
                  total = 0
                  secret_pattern = re.compile(
                      r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|'
                      r'AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{12,}|'
                      r'gh[pousr]_[A-Za-z0-9]{20,}'
                  )
                  for item in z.infolist():
                      name = item.filename
                      if name.endswith('/'):
                          continue
                      names.add(name)
                      total += item.file_size
                      parts = name.split('/')
                      if name.startswith('/') or '\\' in name or '..' in parts or re.match(r'^[A-Za-z]:', name):
                          errors.append('Unsafe archive path: ' + name)
                          continue
                      if ((item.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                          errors.append('Symlinks are not allowed: ' + name)
                      if name == '.env' or (name.startswith('.env.') and name != '.env.example'):
                          errors.append('Environment secret file is not allowed: ' + name)
                      if name.startswith('.github/') or name.startswith('reference/') or name.startswith('.git/'):
                          errors.append('Installer, Git metadata, and references must remain outside the deployable ZIP: ' + name)
                      if name.lower().endswith(('.ts', '.tsx', '.js', '.mjs', '.json', '.md', '.css', '.yml', '.yaml', '.rules')):
                          content = z.read(name).decode('utf-8', errors='ignore')
                          if secret_pattern.search(content):
                              errors.append('Potential credential pattern found in: ' + name)
                  missing = required - names
                  if missing:
                      errors.append('Required files missing: ' + ', '.join(sorted(missing)))
                  if total > 30 * 1024 * 1024:
                      errors.append('Archive expands beyond the 30 MB safety limit.')
                  print(f'Validated {len(names)} files and {total:,} uncompressed bytes.')
          except Exception as exc:
              errors.append('Could not validate the ZIP: ' + str(exc))
          if errors:
              for error in errors:
                  print('::error::' + error)
              sys.exit(1)
          PY

      - name: Replace old repository files with the website archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP='saad-maqbool-complete-website.zip'
          WORKFLOW='.github/workflows/install-complete-website.yml'

          # Remove old root-level code while preserving Git metadata, the ZIP,
          # and the currently running one-time installer workflow.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name "$ZIP" ! -name '.github' \
            -exec rm -rf -- {} +

          # Remove any other GitHub configuration/workflows but preserve this workflow until extraction finishes.
          if [ -d .github ]; then
            find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf -- {} +
          fi
          if [ -d .github/workflows ]; then
            find .github/workflows -mindepth 1 -maxdepth 1 \
              ! -name 'install-complete-website.yml' -exec rm -rf -- {} +
          fi

          unzip -q "$ZIP" -d .
          test -f package.json
          test -f app/layout.tsx
          test -f components/section-renderer.tsx

          # Required one-time cleanup: delete the uploaded archive and this workflow from the repository.
          rm -f -- "$ZIP" "$WORKFLOW"
          rmdir .github/workflows .github 2>/dev/null || true

          git add -A
          git status --short

      - name: Commit and push the replacement codebase
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace website with SM Automations frontend redesign'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo 'Website source committed. The uploaded ZIP and one-time installer workflow were removed.'

      - name: Confirm Vercel takes over
        run: echo 'No npm install, application build, or deployment was run by this workflow. Vercel handles the connected Git deployment.'
