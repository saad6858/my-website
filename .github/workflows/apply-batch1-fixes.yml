name: Apply Batch 1 fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fix archive
        run: |
          # The workflow expects the ZIP to be present at the repo root as batch1-fixes.zip
          # (uploaded by the owner before running this workflow).
          if [ ! -f batch1-fixes.zip ]; then
            echo "batch1-fixes.zip not found at repository root. Upload it first, then re-run."
            exit 1
          fi

      - name: Extract and apply files
        run: |
          set -e
          mkdir -p /tmp/batch1-extract
          unzip -o batch1-fixes.zip -d /tmp/batch1-extract

          # Copy each fixed file to its exact path
          mkdir -p app/api/admin/settings
          mkdir -p app/api/analytics
          mkdir -p app/admin
          mkdir -p components
          mkdir -p public

          cp -f /tmp/batch1-extract/app/api/admin/settings/route.ts app/api/admin/settings/route.ts
          cp -f /tmp/batch1-extract/app/api/analytics/route.ts app/api/analytics/route.ts
          cp -f /tmp/batch1-extract/app/admin/page.tsx app/admin/page.tsx
          cp -f /tmp/batch1-extract/components/contact-form.tsx components/contact-form.tsx
          cp -f /tmp/batch1-extract/next.config.ts next.config.ts
          cp -f /tmp/batch1-extract/app/globals.css app/globals.css
          cp -f /tmp/batch1-extract/public/icon.svg public/icon.svg

          echo "Applied files:"
          ls -la app/api/admin/settings/route.ts
          ls -la app/api/analytics/route.ts
          ls -la app/admin/page.tsx
          ls -la components/contact-form.tsx
          ls -la next.config.ts
          ls -la app/globals.css
          ls -la public/icon.svg

      - name: Remove the uploaded ZIP and this workflow (optional cleanup)
        run: |
          rm -f batch1-fixes.zip
          # Keep the workflow file so it can be re-used; comment out the next line if you want it deleted after one run
          # rm -f .github/workflows/apply-batch1-fixes.yml

      - name: Commit and push
        run: |
          git config user.name "batch1-fix-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Batch 1: security, overflow, form method, CSP, analytics rate limit, favicon accent, admin login cleanup"
            git push
          fi
