
name: Fix Website TypeScript Errors

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-website-errors
  cancel-in-progress: false

jobs:
  fix-and-verify:
    name: Fix, Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply targeted TypeScript fixes
        id: patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/content.ts")
          if not path.exists():
              raise SystemExit("ERROR: lib/content.ts was not found.")

          source = path.read_text()

          old_type = "items?:Array<{title:string;body:string;href?:string;label?:string}>"
          new_type = "items?:Array<{title:string;body?:string;href?:string;label?:string}>"

          if old_type in source:
              source = source.replace(old_type, new_type)
              print("Fixed: Section.items now permits optional body.")
          elif new_type in source:
              print("Already fixed: Section.items body is optional.")
          else:
              raise SystemExit(
                  "ERROR: Could not safely identify the Section.items type."
              )

          settings_marker = "tagline:'AI automation that helps businesses work smarter.',"
          settings_fields = (
              "seoTitle:'Saad Maqbool | AI Automation',"
              "seoDescription:'AI automation and intelligent workflow solutions for businesses.',"
              "socialImage:'',"
          )

          if "seoTitle:" not in source:
              if settings_marker not in source:
                  raise SystemExit(
                      "ERROR: Could not safely locate the initialSettings tagline."
                  )
              source = source.replace(
                  settings_marker,
                  settings_marker + "".join(settings_fields),
                  1
              )
              print("Added SEO title, SEO description and social image defaults.")
          else:
              print("SEO settings already exist; leaving existing values unchanged.")

          path.write_text(source)
          PY

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install

      - name: Run TypeScript checks
        id: typecheck
        continue-on-error: true
        run: |
          mkdir -p repair-report
          npm run typecheck 2>&1 | tee repair-report/typecheck.log
        shell: bash

      - name: Run production build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee repair-report/build.log
        shell: bash

      - name: Record repair results
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          PATCH_RESULT: ${{ steps.patch.outcome }}
        run: |
          mkdir -p repair-report
          {
            echo "# Website repair report"
            echo
            echo "- Patch: ${PATCH_RESULT}"
            echo "- Install: ${INSTALL_RESULT}"
            echo "- TypeScript: ${TYPECHECK_RESULT}"
            echo "- Production build: ${BUILD_RESULT}"
          } > repair-report/repair-report.md

      - name: Commit targeted source fix
        if: steps.patch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/content.ts
          if ! git diff --cached --quiet; then
            git commit -m "Fix website TypeScript errors"
            git push origin HEAD:main
          else
            echo "No source changes to commit."
          fi

      - name: Remove temporary workflows after successful verification
        if: steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' && steps.patch.outcome == 'success'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          git rm -f .github/workflows/diagnose-website.yml || true
          git rm -f .github/workflows/fix-website-errors.yml || true

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove temporary website repair workflows"
            git push origin main
          fi

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-repair-report
          path: repair-report/
          if-no-files-found: warn
