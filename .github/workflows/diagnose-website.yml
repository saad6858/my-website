name: Diagnose Website Errors

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Run Website Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record repository information
        run: |
          {
            echo '# Website Diagnostic Report'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
          } > diagnostic-report.md
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install 2>&1 | tee install.log
      - name: TypeScript diagnostics
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            npx --no-install tsc --noEmit --pretty false
          fi 2>&1 | tee typecheck.log
      - name: ESLint diagnostics
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          elif [ -x node_modules/.bin/eslint ]; then
            npx --no-install eslint .
          else
            echo 'SKIPPED: ESLint is not configured.'
          fi 2>&1 | tee lint.log
      - name: Production build diagnostics
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log
      - name: Security audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=low 2>&1 | tee security-audit.log
      - name: Assemble diagnostic report
        if: always()
        run: |
          {
            echo '# Diagnostic Results'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            for f in install.log typecheck.log lint.log build.log security-audit.log; do
              if [ -f "$f" ]; then
                echo
                echo "## $f"
                echo '```text'
                cat "$f"
                echo '```'
              fi
            done
          } >> diagnostic-report.md
          cat diagnostic-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-diagnostic-${{ github.run_number }}
          path: |
            diagnostic-report.md
            install.log
            typecheck.log
            lint.log
            build.log
            security-audit.log
          if-no-files-found: warn
          retention-days: 14