name: Apply Batch 3 fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require ZIP
        run: |
          if [ ! -f batch3-fixes.zip ]; then
            echo "batch3-fixes.zip not found at repository root."
            exit 1
          fi

      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/b3x
          unzip -o batch3-fixes.zip -d /tmp/b3x
          mkdir -p components public app
          cp -f /tmp/b3x/components/brand-logo.tsx components/brand-logo.tsx
          cp -f /tmp/b3x/components/monogram.tsx components/monogram.tsx
          cp -f /tmp/b3x/components/automation-art.tsx components/automation-art.tsx
          cp -f /tmp/b3x/components/section-renderer.tsx components/section-renderer.tsx
          cp -f /tmp/b3x/components/site-footer.tsx components/site-footer.tsx
          cp -f /tmp/b3x/app/globals.css app/globals.css
          cp -f /tmp/b3x/public/icon.svg public/icon.svg
          if [ -f /tmp/b3x/app/projects/page.tsx ]; then
            mkdir -p app/projects
            cp -f /tmp/b3x/app/projects/page.tsx app/projects/page.tsx
          fi
          ls -la components/brand-logo.tsx components/automation-art.tsx components/section-renderer.tsx components/site-footer.tsx app/globals.css public/icon.svg

      - name: Remove ZIP
        run: rm -f batch3-fixes.zip

      - name: Commit and push
        run: |
          git config user.name "batch3-fix-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Batch 3: logo, hero visual v2, marquee, showcase/CTA/footer cleanup, FAQ spacing, performance containment"
            git push
          fi
