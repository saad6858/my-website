name: Apply Fix2b (theme public-data wipe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ZIP
        run: |
          if [ ! -f fix2b-theme-public-data.zip ]; then echo "Missing zip"; exit 1; fi
      - name: Extract and apply
        run: |
          set -e
          mkdir -p /tmp/fx
          unzip -o fix2b-theme-public-data.zip -d /tmp/fx
          mkdir -p lib
          cp -f /tmp/fx/lib/public-data.ts lib/public-data.ts
          grep -q "slate','ink','forest" lib/public-data.ts
          ls -la lib/public-data.ts
      - name: Remove ZIP
        run: rm -f fix2b-theme-public-data.zip
      - name: Commit and push
        run: |
          git config user.name "fix2b-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Fix2b: stop getSiteSettings wiping slate/ink/forest back to dark"
            git push
          fi
