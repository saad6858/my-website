name: Install complete website

on:
  workflow_dispatch:
    inputs:
      confirm_replace:
        description: 'Type REPLACE to confirm that all existing repository code will be replaced.'
        required: true
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: install-complete-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the branch where the workflow was started
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Confirm destructive replacement
        env:
          CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
        run: |
          if [ "$CONFIRM_REPLACE" != 'REPLACE' ]; then
            echo '::error::No changes made. Re-run manually and type REPLACE to confirm.'
            exit 1
          fi

      - name: Validate the uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='saad-maqbool-complete-website.zip'
          WORKFLOW='.github/workflows/install-complete-website.yml'
          test -f "$ZIP" || { echo '::error::Upload saad-maqbool-complete-website.zip to the repository root first.'; exit 1; }
          test -f "$WORKFLOW" || { echo '::error::The installer workflow must be at .github/workflows/install-complete-website.yml.'; exit 1; }
          python3 - <<'PY'
          import os, re, stat, sys, zipfile
          path='saad-maqbool-complete-website.zip'
          required={'package.json','tsconfig.json','next.config.ts','app/layout.tsx','app/page.tsx','app/admin/page.tsx','app/api/contact/route.ts','lib/firebase-admin.ts','README.md','firestore.rules'}
          errors=[]
          try:
              z=zipfile.ZipFile(path)
              corrupt=z.testzip()
              if corrupt: errors.append('Corrupt ZIP entry: '+corrupt)
              files=[]; total=0
              secret=re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{12,}|gh[pousr]_[A-Za-z0-9]{20,}')
              for info in z.infolist():
                  name=info.filename
                  if name.endswith('/'): continue
                  files.append(name); total+=info.file_size
                  parts=name.split('/')
                  if name.startswith('/') or '\\' in name or '..' in parts or re.match(r'^[A-Za-z]:',name): errors.append('Unsafe archive path: '+name); continue
                  mode=(info.external_attr>>16)&0o170000
                  if mode==stat.S_IFLNK: errors.append('Symlinks are forbidden: '+name)
                  if name=='.env' or name.startswith('.env.') and name!='.env.example': errors.append('Environment secret file is forbidden: '+name)
                  if name.startswith('.github/') or name.startswith('.git/'): errors.append('Workflow/Git internals must remain outside ZIP: '+name)
                  if name.lower().endswith(('.ts','.tsx','.js','.mjs','.json','.md','.css','.yml','.yaml','.rules')):
                      data=z.read(name).decode('utf-8',errors='ignore')
                      if secret.search(data): errors.append('Potential secret detected in '+name)
              missing=required-set(files)
              if missing: errors.append('Required files missing: '+', '.join(sorted(missing)))
              if total>30*1024*1024: errors.append('Archive expands beyond the 30 MB safety limit.')
              print(f'Validated {len(files)} files, {total} uncompressed bytes.')
          except Exception as e: errors.append('Could not validate ZIP: '+str(e))
          if errors:
              for error in errors: print('::error::'+error)
              sys.exit(1)
          PY

      - name: Replace repository code with the ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP='saad-maqbool-complete-website.zip'
          WORKFLOW='.github/workflows/install-complete-website.yml'
          # Preserve only Git metadata, the installer ZIP, and this one-time workflow.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name "$ZIP" ! -name '.github' -exec rm -rf -- {} +
          # Preserve the workflow path while removing every other workflow/repo file.
          find .github -mindepth 1 ! -path './.github/workflows' ! -path './.github/workflows/*' -exec rm -rf -- {} + 2>/dev/null || true
          if [ -d .github/workflows ]; then find .github/workflows -mindepth 1 ! -path "./$WORKFLOW" -exec rm -rf -- {} +; fi
          unzip -q "$ZIP" -d .
          test -f package.json
          test -f app/layout.tsx
          # The ZIP and its one-time installer are deliberately removed from the resulting repository.
          rm -f -- "$ZIP" "$WORKFLOW"
          # Remove empty workflow directories so no installer residue remains.
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git status --short

      - name: Commit and push the new codebase
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace website with complete Saad Maqbool site'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo 'Complete website committed. The uploaded ZIP and this workflow were removed from the repository.'

