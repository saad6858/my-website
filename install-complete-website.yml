name: Install complete SM Automations website

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "This replaces the repository contents. Type REPLACE to continue."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: install-sm-automations-website
  cancel-in-progress: false

jobs:
  replace-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBSITE_ZIP: saad-maqbool-complete-website.zip
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Validate and safely extract the complete website ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "REPLACE" ]]; then
            echo "::error::Confirmation must be exactly REPLACE. No repository files were changed."
            exit 1
          fi
          if [[ ! -f "$WEBSITE_ZIP" ]]; then
            echo "::error::Upload $WEBSITE_ZIP to the repository root before running this workflow."
            exit 1
          fi
          python3 - <<'PY'
          import os, re, shutil, stat, sys, tempfile, zipfile, json
          from pathlib import PurePosixPath

          archive = os.environ['WEBSITE_ZIP']
          errors = []
          required = {
              'package.json', 'app/layout.tsx', 'app/page.tsx', 'app/globals.css',
              'components/section-renderer.tsx', 'components/reveal.tsx', 'components/monogram.tsx',
              'lib/media-limits.ts', 'app/api/admin/media/route.ts', 'app/api/admin/settings/route.ts',
              'docs/DOMAIN-SETUP.md', 'scripts/verify-static.cjs', '.env.example'
          }
          root_files = {
              'package.json', 'tsconfig.json', 'next.config.ts', 'eslint.config.mjs',
              'firebase.json', 'firestore.rules', '.gitignore', '.env.example',
              'next-env.d.ts', 'README.md'
          }
          allowed_dirs = ('app/', 'components/', 'lib/', 'public/', 'scripts/', 'docs/')
          secret_pattern = re.compile(r'BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{12,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}')
          try:
              z = zipfile.ZipFile(archive)
          except Exception as e:
              print(f'::error::Could not open ZIP: {e}')
              sys.exit(1)
          if z.testzip() is not None:
              errors.append('ZIP integrity check failed.')
          names = set()
          total_size = 0
          for info in z.infolist():
              name = info.filename
              if name.endswith('/'):
                  continue
              parts = name.split('/')
              if name.startswith('/') or '\\' in name or '..' in parts or '.' in parts or re.match(r'^[A-Za-z]:', name):
                  errors.append(f'Unsafe archive path: {name}')
                  continue
              mode = (info.external_attr >> 16) & 0o170000
              if mode == stat.S_IFLNK:
                  errors.append(f'Symlink is not allowed: {name}')
                  continue
              if info.file_size > 20 * 1024 * 1024:
                  errors.append(f'Unexpectedly large file: {name}')
              total_size += info.file_size
              names.add(name)
              if name not in root_files and not name.startswith(allowed_dirs):
                  errors.append(f'Unexpected top-level path: {name}')
              if name.startswith(('.github/', 'reference/', 'node_modules/', '.next/')):
                  errors.append(f'Installer/reference/dependency files must not be in the ZIP: {name}')
              if name in {'.env', '.env.local', '.env.production', '.env.development'} or (name.startswith('.env.') and name != '.env.example'):
                  errors.append(f'Environment secret file is not allowed: {name}')
              if not name.lower().endswith(('.png','.jpg','.jpeg','.webp','.gif','.ico','.mp4','.webm','.pdf','.woff','.woff2')):
                  try:
                      content = z.read(name).decode('utf-8', errors='ignore')
                      if secret_pattern.search(content):
                          errors.append(f'Possible secret detected in {name}')
                  except Exception:
                      errors.append(f'Could not inspect archive entry: {name}')
          missing = required - names
          if missing:
              errors.append('Missing required website files: ' + ', '.join(sorted(missing)))
          if total_size > 50 * 1024 * 1024:
              errors.append('Uncompressed archive exceeds the 50 MiB safety limit.')
          if not errors:
              try:
                  package = json.loads(z.read('package.json'))
                  deps = package.get('dependencies', {})
                  if deps.get('next') != '16.4.2': errors.append('Unexpected Next.js version in package.json.')
                  if deps.get('react') != '19.3.1' or deps.get('react-dom') != '19.3.1': errors.append('React and React DOM versions do not match the approved pins.')
              except Exception as e:
                  errors.append(f'Could not validate package.json: {e}')
          print(f'ZIP contains {len(names)} files ({total_size:,} uncompressed bytes).')
          if errors:
              for error in errors: print('::error::' + error)
              sys.exit(1)
          destination = os.path.join(os.environ['RUNNER_TEMP'], 'sm-automations-extracted')
          shutil.rmtree(destination, ignore_errors=True)
          os.makedirs(destination, exist_ok=True)
          z.extractall(destination)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'SM_EXTRACTED_DIR={destination}\n')
          print('ZIP validation passed and the site was extracted to a temporary directory.')
          PY

      - name: Replace repository contents and remove installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SM_EXTRACTED_DIR"
          # Keep only .git while replacing the old tracked and untracked codebase.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -a "$SM_EXTRACTED_DIR"/. .
          # The uploaded archive and this one-time workflow are deliberately not retained.
          rm -f "$WEBSITE_ZIP"
          rm -rf .github
          test -f package.json
          test -f app/page.tsx
          test -f components/section-renderer.tsx
          test ! -e "$WEBSITE_ZIP"
          test ! -e .github/workflows/install-complete-website.yml
          git add -A
          git diff --cached --check
          echo 'Final staged changes:'
          git status --short

      - name: Commit and push the complete replacement to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace site with complete SM Automations redesign"
          git push origin HEAD:main
