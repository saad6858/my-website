name: Install production hardening

on:
  push:
    paths:
      - "production-hardening.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-production-hardening
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "production-hardening.zip"
          unzip -q -t "production-hardening.zip"

      - name: Extract repo-root overlay
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          unzip -q "production-hardening.zip" -d "$TMP_DIR"

          ROOT="$TMP_DIR"
          TOP_DIRS=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT="$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          test -f "$ROOT/firestore.rules"
          test -f "$ROOT/app/seed/page.tsx"
          rsync -a "$ROOT/" ./

      - name: Remove one-shot installer and uploaded archive
        shell: bash
        run: |
          rm -f "production-hardening.zip"
          rm -f ".github/workflows/install-production-hardening.yml"

      - name: Commit installed hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Harden production security boundaries"
          git push
