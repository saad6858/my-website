name: Install cinematic redesign v1
on:
  push:
    paths:
      - "cinematic-redesign-v1.zip"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-cinematic-redesign-v1
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Validate overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f cinematic-redesign-v1.zip
          unzip -q -t cinematic-redesign-v1.zip
      - name: Apply overlay
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -q cinematic-redesign-v1.zip -d "$TMP_DIR"
          test -f "$TMP_DIR/app/theme-versions.css"
          test -f "$TMP_DIR/WEBSITE_HANDOFF.md"
          rsync -a "$TMP_DIR/" ./
      - name: Verify critical versions and expected options
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.dependencies["firebase-admin"]!=="13.10.0" || !p.dependencies.lenis) process.exit(1)'
          grep -q 'layoutDesign' types/index.ts
          grep -q 'colorTheme' types/index.ts
          grep -q '95 MB' components/dashboard/files/FileUploader.tsx
      - name: Remove installer and uploaded archive
        shell: bash
        run: |
          rm -f cinematic-redesign-v1.zip
          rm -f .github/workflows/install-cinematic-redesign.yml
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Add cinematic redesign, independent themes, and media improvements"
          git push
